<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزر أمان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen dreamy 3D world (pastel floating islands above a sea of clouds). HTML on top: HUD row, one goal line or the speech card at the top, toasts at the bottom, cards centered. Each island owns one color + one icon so the four topics never blur together. Single soft-sky look on purpose, no dark variant. */
:root{
  --ink:#2c2650; --paper:#fffaf5; --muted:#6e668f;
  --gold:#ffb800; --green:#1fb88a; --pink:#ff6fae; --blue:#4f8df5;
  --good:#1fb88a; --bad:#ff5c7a; --sun:#ffc93c; --grape:#8a5cff;
  --accent:var(--grape);
  --font:"Baloo Bhaijaan 2",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe0ff;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;direction:rtl}
#ui > *{pointer-events:auto}
#ui > .topzone,#ui > #joy{pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;direction:rtl}

.btn{font-family:var(--font);font-weight:700;font-size:1.1rem;border:3px solid var(--ink);border-radius:20px;background:#fff;padding:9px 20px;box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;line-height:1.3}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--sun)}
.btn.safe{background:var(--good);color:#fff}
.btn.no{background:var(--bad);color:#fff}
.btn.c1{background:#8a5cff;color:#fff}
.btn.c2{background:#4f8df5;color:#fff}
.btn.big{font-size:1.4rem;padding:12px 28px}
.btn.small{font-size:.95rem;padding:5px 12px;box-shadow:0 3px 0 var(--ink);border-radius:14px}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));pointer-events:none;background:linear-gradient(rgba(20,18,60,.45),rgba(20,18,60,0))}
#hud > *{pointer-events:auto}
.hgroup{display:flex;gap:8px;align-items:center;min-width:0}
.ibtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:1.35rem;display:grid;place-items:center;padding:0;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
#menu{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:grid;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:8px;animation:drop .25s both;z-index:5}
#menu.bottom{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
.mrow{display:flex;gap:10px;align-items:center;border:0;background:#f3efff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.05rem;text-align:right;white-space:nowrap}
.chip{font-weight:800;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 14px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-size:1.05rem}
#hTitle{font-size:1.15rem;background:var(--accent);color:#fff;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grow{flex:1}
#meter{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 10px 2px 6px;box-shadow:0 3px 0 var(--ink);flex:none}
#meter b{display:block;width:min(150px,22vw);height:16px;border-radius:999px;background:#e9e6f5;overflow:hidden;position:relative}
#meter i{position:absolute;inset:0 0 0 auto;transition:width .6s,background .6s;border-radius:999px}

/* top line: the goal OR the speech card */
.topzone{position:fixed;left:0;right:0;top:calc(62px + env(safe-area-inset-top,0px));display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#mission > div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:22px;padding:6px 8px 6px 16px;box-shadow:0 5px 0 var(--ink);max-width:min(640px,100%);animation:drop .35s both}
#mission .mi{font-size:1.7rem;line-height:1;width:48px;height:48px;display:grid;place-items:center;background:var(--accent);border-radius:16px;flex:none;border:2px solid var(--ink)}
#mission .mt{font-weight:800;font-size:clamp(1.1rem,2.8vw,1.35rem);line-height:1.35}
#mission .mp{font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:2px 12px;white-space:nowrap;flex:none}
#mission small{display:block;color:var(--accent);font-size:.85rem}
#mission.low{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#dlg:not([hidden]) ~ #mission{visibility:hidden}

#dlg .din{pointer-events:auto;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;width:100%;max-width:820px;animation:drop .3s both}
.port{background:#fff;border:4px solid var(--ink);border-radius:50%;aspect-ratio:1;overflow:hidden;padding-top:8px;box-shadow:0 5px 0 var(--ink)}
.port svg{width:100%;height:auto;display:block}
.dbox{background:var(--paper);border:4px solid var(--ink);border-radius:6px 24px 24px 24px;padding:10px 16px;box-shadow:0 6px 0 var(--ink);display:grid;gap:8px;min-width:0;position:relative}
.dbox.good{border-color:var(--good);box-shadow:0 6px 0 var(--good);background:#effcf6}
.dbox.bad{border-color:var(--bad);box-shadow:0 6px 0 var(--bad);background:#fff1f3}
.verdict{display:none;font-size:1.7rem;font-weight:800;line-height:1}
.dbox.good .verdict{display:block;color:var(--good)}
.dbox.bad .verdict{display:block;color:var(--bad)}
.dtop{display:flex;align-items:center;gap:8px}
.dtop b{color:var(--grape);font-size:1.1rem;flex:1}
.dtext{font-size:clamp(1.2rem,2.8vw,1.45rem);font-weight:700;line-height:1.55;margin:0;min-height:1.6em}
.dch{display:flex;gap:10px;flex-wrap:wrap}
.dch .btn{flex:1 1 auto}
.dch .btn.big{font-size:1.3rem}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 18px;font-weight:800;font-size:1.2rem;box-shadow:0 5px 0 var(--ink);width:max-content;max-width:min(560px,92vw);text-align:center;pointer-events:none;animation:popc .3s both}
#toast.bad{background:#ffe3e8;border-color:var(--bad);box-shadow:0 5px 0 var(--bad)}
#toast.good{background:#dcf8ec;border-color:var(--good);box-shadow:0 5px 0 var(--good)}

#tut{position:fixed;left:50%;top:56%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;pointer-events:none}
#tut .hand{font-size:3.6rem;animation:drag 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(44,38,80,.35))}
#tut span{background:rgba(44,38,80,.88);color:#fff;font-weight:800;border-radius:999px;padding:5px 16px;font-size:1.1rem;white-space:nowrap}
@keyframes drag{0%{transform:translate(0,0)}35%{transform:translate(-40px,-30px)}55%{transform:translate(-40px,-30px)}100%{transform:translate(0,0)}}

/* Sky-style touch stick: appears where the finger lands */
#joy{position:fixed;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.8);box-shadow:0 0 30px rgba(255,255,255,.6)}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 18px rgba(255,240,200,.9)}

/* floating labels */
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:1rem;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 10px;box-shadow:0 3px 0 var(--ink);will-change:transform}
.lbl small{font-size:.8rem;opacity:.85}
.lbl.dark{background:var(--ink);color:#fff}
.lbl.good{background:var(--good);color:#fff}
.lbl.bad{background:var(--bad);color:#fff}
.lbl.q{background:var(--sun)}
.lbl.react{background:none;border:0;box-shadow:none;padding:0}
.rx{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;font-size:2.7rem;color:#fff;border:4px solid var(--ink);animation:rise 1.15s forwards}
.react.good .rx{background:var(--good)}
.react.bad .rx{background:var(--bad)}
@keyframes rise{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
#hGems{background:#fff6d6}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.3)}}
.pmsg{margin:0;font-weight:800;color:var(--grape);font-size:1.1rem}
.lbl.big{font-size:1.15rem;padding:4px 12px}
.lbl.isl{pointer-events:auto;cursor:pointer;font-size:1.15rem;padding:6px 14px 6px 16px;border-radius:18px;text-align:center;line-height:1.25;display:flex;align-items:center;gap:10px}
.lbl.isl .n{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:1.3rem;flex:none;border:2px solid var(--ink)}
.lbl.isl small{display:block;font-size:.85rem;font-weight:700;color:var(--muted);opacity:1}
.lbl.isl .st{color:#e0a400;letter-spacing:2px;font-size:.95rem}
.lbl.isl .st .off{color:#c7cbd6}
.lbl.isl.lock{background:#ece9f7;color:#8c86a8;box-shadow:0 3px 0 #8c86a8;border-color:#8c86a8}
.lbl.isl.lock .n{background:#8c86a8!important;border-color:#8c86a8}
.lbl.isl.next{background:#fff6d6;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 3px 0 var(--ink),0 0 0 9px rgba(255,201,60,.5)}}
.portrait .lbl.isl{padding:4px;border-radius:50%}
.portrait .lbl.isl > span:last-child{display:none}

/* panels */
#panel{position:fixed;inset:0;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#panel.dim{background:rgba(44,38,80,.4);backdrop-filter:blur(2px)}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:20px;max-width:560px;width:100%;display:grid;gap:12px;justify-items:center;text-align:center;animation:pop .4s both}
.card h2{margin:0;font-size:clamp(1.5rem,5vw,1.9rem);line-height:1.3}
.logo{font-size:clamp(3rem,13vw,5.6rem);font-weight:800;color:#fff;line-height:1.1;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 40px rgba(255,255,255,.8)}
.tagline{font-size:clamp(1.1rem,3.4vw,1.4rem);font-weight:700;color:#fff;background:rgba(44,38,80,.7);border-radius:999px;padding:4px 18px;text-align:center}
.titlewrap{display:grid;gap:18px;justify-items:center;text-align:center}
#warp{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:10px;background:radial-gradient(circle at 50% 50%,var(--wc,#8a5cff) 0%,#1c2470 70%);z-index:30;animation:warpIn .4s both;overflow:hidden}
#warp.out{animation:warpOut .5s forwards}
#warp .wi{font-size:7rem;line-height:1;animation:pop .5s both;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
#warp b{font-size:clamp(2rem,7vw,3rem);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#warp .ring{position:absolute;width:40vmin;height:40vmin;border-radius:50%;border:6px solid rgba(255,255,255,.7);animation:ring 1.2s ease-out infinite}
#warp .ring.r2{animation-delay:.4s}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(3);opacity:0}}
@keyframes warpIn{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
@keyframes warpOut{to{opacity:0;transform:scale(.9)}}
.btn.glow{animation:glowbtn 1.4s ease-in-out infinite}
@keyframes glowbtn{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(255,201,60,.7)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 14px rgba(255,201,60,0)}}
.logo{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.titlewrap.full{min-height:calc(100vh - 40px);grid-template-rows:auto 1fr auto;align-items:start;width:100%}
.titlewrap.full .bottom{display:grid;gap:14px;justify-items:center}
.credit{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:18px;padding:6px 12px;box-shadow:0 4px 0 var(--ink)}
.credit img{height:58px;width:auto;display:block}
.credit span{font-weight:800;font-size:.85rem;color:var(--muted);white-space:nowrap}
.cert .credit{box-shadow:none;border-width:2px}
.credit.corner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));flex-direction:column;gap:2px;padding:6px 10px;border-radius:16px;animation:drop .5s both}
.credit.corner img{height:64px}
@media (max-width:640px){.credit.corner img{height:40px}.credit.corner span{font-size:.75rem}.titlewrap.full{padding-top:78px}}
.topics{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.topics span{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.field{display:grid;gap:6px;width:100%;max-width:380px;text-align:right}
.field label{font-weight:800;font-size:1.1rem}
.field input{font:inherit;font-size:1.25rem;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;background:#fff;color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
.avs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.av{width:76px;border:3px solid var(--ink);border-radius:20px;background:#fff;padding:5px 5px 0;box-shadow:0 4px 0 var(--ink)}
.av svg{width:100%;display:block}
.av[aria-pressed="true"]{background:var(--sun);transform:translateY(-4px)}

/* lesson card: what is it, why it matters, the rule, how to play */
.card.intro{max-width:460px;gap:14px}
.say1{margin:0;font-size:clamp(1.25rem,3.2vw,1.5rem);font-weight:700;line-height:1.6;background:#fff;border:3px dashed var(--accent);border-radius:20px;padding:12px 16px;width:100%}
.lic{width:76px;height:76px;border-radius:24px;background:var(--accent);border:4px solid var(--ink);display:grid;place-items:center;font-size:2.6rem;box-shadow:0 5px 0 var(--ink)}
.eyebrow{font-weight:800;color:var(--accent);font-size:1rem;margin:0;filter:brightness(.8)}
.lesson{display:grid;gap:8px;width:100%}
.lesson > div{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:right;border-radius:18px;padding:8px 12px;font-weight:700;font-size:1.12rem;line-height:1.5}
.lesson > div > span{font-size:1.7rem;text-align:center}
.lesson b{display:block;font-size:.9rem;color:var(--muted)}
.lesson .what{background:#eef4ff}
.lesson .why{background:#fff0f3}
.lesson .rule{background:#effcf6;border:3px dashed var(--good)}
.how{width:100%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.how div{display:flex;gap:6px;align-items:center;background:#f3efff;border-radius:999px;padding:5px 14px 5px 10px;font-weight:800;font-size:1rem}
.how div span{font-size:1.3rem}
.legend{display:grid;gap:6px;width:100%}
.legend div{display:flex;gap:8px;align-items:center;font-weight:700;background:#fff;border:2px solid #e2dcf5;border-radius:14px;padding:5px 10px;text-align:right}
.legend span{font-size:1.4rem}

.bigstars{font-size:3.6rem;letter-spacing:6px;line-height:1}
.bigstars span{display:inline-block;animation:pop .5s both}
.bigstars .off{color:#c7cbd6}
.bigstars .on{color:#ffb800;text-shadow:0 3px 0 var(--ink)}
.badge{display:inline-grid;justify-items:center;gap:2px;font-weight:800;font-size:.8rem}
.badge i{font-style:normal;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--bc) 13%);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 0 0 4px rgba(255,255,255,.6)}
.badge.big i{width:96px;height:96px;font-size:3rem;animation:badgein .9s cubic-bezier(.2,1.6,.4,1) both}
.badge.big small{font-size:1.1rem}
.badge.off{opacity:.3;filter:grayscale(1)}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes badgein{0%{transform:scale(0) rotate(-180deg)}100%{transform:none}}
.rulebox{background:#fff;border:3px dashed var(--accent);border-radius:20px;padding:12px 16px;font-size:1.2rem;font-weight:700;line-height:1.6;width:100%}
.rulebox b{color:var(--accent);display:block;font-size:1rem;filter:brightness(.8)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mapbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;justify-content:center;align-items:center;gap:8px;padding:6px;pointer-events:auto;background:rgba(255,255,255,.88);border:3px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);width:max-content;max-width:calc(100vw - 24px);flex-wrap:wrap}
.mapbar .chip{box-shadow:none}
.mapbar .btn{box-shadow:0 3px 0 var(--ink);padding:6px 16px;border-radius:999px}

/* review quiz: tell the four topics apart */
.quizq{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;font-size:1.3rem;font-weight:800;line-height:1.5;width:100%}
.quizgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.quizgrid .btn{display:grid;justify-items:center;gap:2px;padding:10px 6px;color:#fff;font-size:1.05rem}
.quizgrid .btn span{font-size:2rem;line-height:1}
.quizgrid .btn.dim{opacity:.35}

.cert{border:6px double var(--ink);position:relative}
.cert::before{content:"";position:absolute;inset:8px;border:2px solid var(--pink);border-radius:20px;pointer-events:none}
.cert .who{font-size:clamp(2rem,8vw,3rem);font-weight:800;color:var(--pink);border-bottom:3px dotted var(--ink);padding:0 20px;line-height:1.3}
.cert ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;text-align:right}
.cert li{display:flex;gap:10px;align-items:center;border-radius:14px;padding:6px 12px;font-weight:700;color:#fff}
.cert li > span:first-child{font-size:1.4rem}
.cert li > span:last-child{margin-inline-start:auto;white-space:nowrap}
.cert .off{opacity:.4}
.muted{color:var(--muted);font-weight:700}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes popc{0%{transform:translateX(-50%) scale(.5);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:1.6rem;font-weight:800;color:var(--ink);direction:rtl;text-align:center;padding:16px}
@media (max-width:640px){
  #dlg .din{grid-template-columns:62px 1fr}
  .dbox{padding:8px 12px}
  #hTitle{font-size:1rem}
  .chip{font-size:.95rem;padding:2px 10px}
  .lbl{font-size:.9rem}
  .lbl.isl{font-size:1rem}
  #mission .mi{width:40px;height:40px;font-size:1.35rem}
  .card{padding:16px 12px}
}
@media (max-height:760px){
  .card{gap:8px;padding:14px 16px}

function pending(exec){

const wait = s => pending(res => { let t = 0; const f = dt => { t += dt; if (t >= s){ off(f); res(); } }; tickers.push(f); });

function rnd(x, y, z){ const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }

function giftDecor(i){ const g = giftMesh([0xb48cff, 0x7fe0c0, 0xff8fbf][i % 3]); g.scale.setScalar(1.2 + (i % 2) * .5); g.rotation.y = i; return g; }
function buildIsland(idx, r = 13){

  parts.holos = D.holos.map((k, i) => { const h = holo(k, D.line, 2); const a = Math.PI + (i / (D.holos.length - 1) - .5) * 3; h.position.set(Math.sin(a) * (r + .5), 5 + (i % 3) * 1.2, Math.cos(a) * (r + .5) - 2); g.add(h); return h; });
  const hy = parts.holos.map(h => h.position.y);
  every(() => parts.holos.forEach((h, i) => { h.position.y = hy[i] + Math.sin(T * 1.2 + i) * .35; }));

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function pick(x, y){ const r = canvas.getBoundingClientRect(); ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
let ptr = null; const joy = { x:0, y:0, on:false };
function joyEnd(){ ptr = null; joy.on = false; joy.x = joy.y = 0; $('#joy').hidden = true; }
function tapAt(x, y){
  pick(x, y);
  // tapping a person, a pad or an item walks straight to it
  const hits = ray.intersectObjects(taps.filter(t => t.obj.parent && t.obj.visible).map(t => t.obj), true);
  if (hits.length){
    let o = hits[0].object; const t = () => taps.find(t => t.obj === o);
    while (o && !t()) o = o.parent;
    const tp = o && t();
    if (tp){ const w = new THREE.Vector3(); tp.obj.getWorldPosition(w); goTo(w.x, w.z, tp.stop); return; }
  }
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(groundPlane, p)) goTo(p.x, p.z, 0);
}
function goTo(x, z, stop = 0){
  const l = Math.hypot(x, z); if (l > walkR){ x *= walkR / l; z *= walkR / l; }
  if (stop){ const dx = x - player.position.x, dz = z - player.position.z, d = Math.hypot(dx, dz); if (d > stop){ x -= dx / d * stop; z -= dz / d * stop; } else { x = player.position.x; z = player.position.z; } }
  moveTarget = new THREE.Vector3(x, 0, z);
  if (tapRing){ tapRing.position.set(x, .08, z); tapRing.visible = true; tapRing.scale.setScalar(1); }
}
canvas.addEventListener('pointerdown', e => {

  if (mode !== 'level' || busy || !player) return;
  ptr = { id:e.pointerId, x:e.clientX, y:e.clientY };
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id || busy) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, d = Math.hypot(dx, dy);
  if (!joy.on && d > 14){ joy.on = true; moveTarget = null; const j = $('#joy'); j.hidden = false; j.style.transform = `translate(${ptr.x}px,${ptr.y}px)`; }
  if (joy.on){
    const k = Math.min(1, d / 55); joy.x = dx / (d || 1) * k; joy.y = dy / (d || 1) * k;
    $('#joy i').style.transform = `translate(${joy.x * 34}px,${joy.y * 34}px)`;
  }
});
const endPtr = e => { if (!ptr || e.pointerId !== ptr.id) return; if (!joy.on && !busy) tapAt(e.clientX, e.clientY); joyEnd(); };
canvas.addEventListener('pointerup', endPtr);

const speed = 5; let stepT = 0, trailT = 0;
const vel = new THREE.Vector2();
const dist2 = (a, x, z) => Math.hypot(a.position.x - x, a.position.z - z);
function face(obj, x, z){ obj.rotation.y = Math.atan2(x - obj.position.x, z - obj.position.z); }
function animLegs(c, moving, dt){
  const u = c.userData; if (!u || !u.legs) return;
  u.ph = (u.ph || 0) + (moving ? dt * 10 : 0);
  const a = moving ? Math.sin(u.ph) * .55 : u.legs[0].rotation.x * .8;
  if (u.quad){ u.legs[0].rotation.x = a; u.legs[3].rotation.x = a; u.legs[1].rotation.x = -a; u.legs[2].rotation.x = -a; return; }
  u.legs[0].rotation.x = a; u.legs[1].rotation.x = -a;
  if (u.arms){ u.arms[0].rotation.x = -a * .8; u.arms[1].rotation.x = a * .8; }
}
function collide(o, rad = .45){
  for (const b of obstacles){ const dx = o.position.x - b.x, dz = o.position.z - b.z, d = Math.hypot(dx, dz), m = b.r + rad; if (d < m && d > 1e-4){ o.position.x = b.x + dx / d * m; o.position.z = b.z + dz / d * m; } }
  const l = Math.hypot(o.position.x, o.position.z); if (l > walkR){ o.position.x *= walkR / l; o.position.z *= walkR / l; }
}
let walked = 0;
function updatePlayer(dt){
  if (!player) return;
  let dx = 0, dz = 0, k = 1;
  if (!busy){
    if (keys['arrowup'] || keys['w']) dz -= 1;
    if (keys['arrowdown'] || keys['s']) dz += 1;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;
    if (joy.on && (joy.x || joy.y)){ dx = joy.x; dz = joy.y; k = Math.hypot(dx, dz); }
  }
  if (dx || dz){ moveTarget = null; const l = Math.hypot(dx, dz); dx /= l; dz /= l; }

    const px = player.position.x, pz = player.position.z;

    collide(player);
    const step = Math.hypot(player.position.x - px, player.position.z - pz);
    walked += step;
    if (moving){ const tr = Math.atan2(vel.x, vel.y); let d = tr - player.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); player.rotation.y += d * Math.min(1, dt * 10); }
    if (moveTarget && moving && step < sp * dt * .15) moveTarget = null; // stuck on an obstacle
    if (moving){ stepT += dt; if (stepT > .3){ stepT = 0; sfx.step(); } trailT += dt; if (trailT > .1){ trailT = 0; sparkleAt(player.position); } }
  }
  if (!player.userData.jump) player.position.y = moving ? Math.abs(Math.sin(player.userData.ph || 0)) * .13 : 0;
  // lean into the walk, like gliding
  player.rotation.order = 'YXZ';
  player.rotation.x += ((moving ? .16 * Math.min(1, sp / speed) : 0) - player.rotation.x) * Math.min(1, dt * 8);
  player.rotation.z = moving ? Math.sin(player.userData.ph || 0) * .05 : 0;
  animLegs(player, moving, dt);

    fresh.forEach(b => {
      if (!b.alive) return;
      if (b.ad.ok){ b.state = 'ok'; b.g.userData.body.material = mat(0x1fb88a, { emissive:0x1fb88a, emissiveIntensity:.35 }); b.L.el.className = 'lbl good big'; b.L.el.textContent = '✓ ' + b.ad.n; puff(b.g.position, 0x1fb88a, 8); tappable(b.g, 0); }
      else {
        b.state = 'bad'; b.g.userData.body.material = mat(0xff3b5b); b.L.el.className = 'lbl bad big'; b.L.el.textContent = '✗ ' + b.ad.bad;
        quiet(wait(2).then(() => { if (!b.alive) return; puff(b.g.position, 0xff5c7a); scene.remove(b.g); removeBox(b); }));
      }
    });
    right('شكراً إنك سألتيني يا قلبي 💜');
  }
  every(dt => {
    momCool -= dt;
    if (spawned < ADS.length && boxes.filter(b => b.alive).length < 2 && !busy){
      const last = boxes[boxes.length - 1];
      if (!last || last.state !== 'falling'){ spawnT += dt; if (spawnT > 1.6){ spawnT = 0; spawn(); } }
    }
    if (resolved === ADS.length) return;
    // one clear goal at a time
    const fresh = boxes.filter(b => b.alive && b.state === 'new'), oks = boxes.filter(b => b.alive && b.state === 'ok');
    if (fresh.length){ mission('🙋‍♀️', 'نزلت لعبة! روحي لماما واسأليها', resolved, ADS.length); guide(mom, 2.8); }
    else if (oks.length){ mission('💚', 'ماما وافقت! خذي اللعبة الخضرا', resolved, ADS.length); guide(nearest(oks.map(b => b.g)), 2.2); }
    else { mission('⏳', 'انتظري اللعبة الجاية...', resolved, ADS.length); guide(null); }
    if (busy) return;
    if (momCool <= 0 && dist2(player, mom.position.x, mom.position.z) < 2.4) quiet(momCheck());
    for (const b of boxes){
      if (!b.alive || b.state === 'falling') continue;
      b.g.rotation.y += dt * .6;
      if (b.state === 'ok' && Math.random() < .1) sparkleAt(b.g.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xb0ffd8);
      if (b.state === 'bad' || dist2(b.g, player.position.x, player.position.z) > 1.25) continue;
      if (b.state === 'new'){
        removeBox(b); scene.remove(b.g);
        const f = fox3d(); f.position.copy(b.g.position); scene.add(f); puff(f.position, 0xf7902a);
        let t = 0; every(function jf(dt2){ t += dt2; f.position.y = Math.abs(Math.sin(t * 8)) * .8; f.rotation.y += dt2 * 6; if (t > 1.4){ puff(f.position, 0xf7902a); scene.remove(f); off(jf); } });
        mistake('✗ أخذتيها بدون إذن! طلعت الثعلبة 🦊');
      } else if (b.state === 'ok'){
        removeBox(b); collected++; sfx.sparkle(); right('✓ أخذتِ "' + b.ad.n + '" بإذن ماما');
        const g = b.g; quiet(tween(.4, e => { g.scale.setScalar(1 - e); g.position.y = e * 1.5; }).then(() => scene.remove(g)));
      }
    }
  });
  await waitUntil(() => resolved === ADS.length);
  guide(null); $('#mission').hidden = true;
  await wait(.5);
  await finish(2, starsFor(mistakes), 'قبل أي تحميل، أسأل ماما أو بابا.', '💜 ماما: أحب إنك تسأليني يا عمري!');
}

/* ================= ISLAND 4: strangers online ================= */
const MSGS = [
  { from:'نجمة_الألعاب', who:'hooded', t:'هلا! كم عمرك؟ أرسلي صورتك 😊', ans:['shield', 'tell'], ok:'صح! هذي أشياء خاصة 🛡️', no:'لا! ما نعطي صورنا للغرباء' },
  { from:'ليان – بنت خالتك', who:'cousin', friend:true, t:'متى بتجون بيت جدتي اليوم؟', ans:['chat', 'tell'], ok:'صح! ليان تعرفينها 💗', no:'ليان قريبتك، ردي عادي!' },
  { from:'نجمة_الألعاب', who:'hooded', t:'لا تقولين لأهلك عن كلامنا، خليه سر 🤫', ans:['tell'], ok:'صح! قولي لأهلك 🏠', no:'لازم تقولين لأهلك!' },
  { from:'نجمة_الألعاب', who:'hooded', t:'تعالي بكرة الحديقة وأعطيك جواهر 🎁', ans:['tell'], ok:'صح! ما نقابل غرباء أبداً', no:'خطر! قولي لأهلك 🏠' },
];
const PADS4 = { shield:{ t:'🛡️ ما أشارك', c:0x4f8df5, ico:'shield', x:-5.5 }, tell:{ t:'🏠 أقول لأهلي', c:0x8a5cff, ico:'home', x:0 }, chat:{ t:'💬 أرد عادي', c:0x1fb88a, ico:'chat', x:5.5 } };
async function levelMountain(){
  const top = world.parts.pillarTop;
  const str = hooded3d(); str.position.set(0, top, -8); scene.add(str);
  const strL = label(str, 'نجمة_الألعاب ⭐', 'dark big', 2.6);
  every(() => { str.position.y = top + Math.abs(Math.sin(T * 2)) * .1; if (player) face(str, player.position.x, player.position.z); });
  const cousin = girl3d(CAST.cousin.d3); cousin.position.set(9, 0, 1); cousin.visible = false; scene.add(cousin);
  label(cousin, 'ليان 💗', 'good big', 2.6);
  for (let i = 0; i < 40; i++){ const s = mk(G.oct(.08), 0xffffff, 0, 0, 0, { emissive:0xffffff, emissiveIntensity:.6 }); s.castShadow = false; s.position.set((Math.random() - .5) * 30, Math.random() * 14, (Math.random() - .5) * 26); scene.add(s); const v = .5 + Math.random() * .5; every(dt => { s.position.y -= v * dt; s.position.x += Math.sin(T + i) * dt * .3; if (s.position.y < 0) s.position.y = 14; }); }
  player.position.set(0, 0, 6.5);
  const pads = Object.entries(PADS4).map(([k, d]) => { const p = padMesh(d.c); p.position.set(d.x, 0, 1); scene.add(p); tappable(p, 0); const ic = icon(d.ico); ic.position.set(0, 1.5, 0); p.add(ic); every(() => { ic.rotation.y = Math.sin(T * 1.4) * .5; }); label(p, d.t, 'big', 2.6); return { k, p }; });
  await lessonCard({ num:'٤', icon:'💬', title:'الغرباء بالإنترنت',
    say:'اللي ما تعرفينه بالحقيقة غريب 👤 لا تعطينه اسمك ولا صورتك، وقولي لأهلك.',
    chips:[['🛡️', 'ما أشارك'], ['🏠', 'أقول لأهلي'], ['💬', 'أرد عادي']] });
  showTut();
  for (let i = 0; i < MSGS.length; i++){
    const m = MSGS[i];
    const src = m.friend ? cousin : str;
    if (m.friend){ cousin.visible = true; face(cousin, player.position.x, player.position.z); puff(cousin.position, 0xff8fc8, 8); }
    // the envelope flies from the sender to the player
    busy = true;
    const env = new THREE.Group(); env.add(mk(G.box(.9, .6, .08), 0xffffff, 0, 0, 0, { emissive:0xffffff, emissiveIntensity:.3 })); const fl = mk(G.cone(.45, .3, 4), 0xffc93c, 0, .15, .05); fl.rotation.set(Math.PI / 2, Math.PI / 4, 0); fl.scale.set(1.4, 1, .6); env.add(fl);
    const a = src.position.clone().add(new THREE.Vector3(0, 2.3, 0)); env.position.copy(a); scene.add(env); sfx.whoosh();
    await tween(1, e => { const b = player.position.clone().add(new THREE.Vector3(0, 2.6, 0)); env.position.lerpVectors(a, b, e); env.position.y += Math.sin(e * Math.PI) * 3; env.rotation.y = e * 6; if (Math.random() < .4) sparkleAt(env.position); });
    scene.remove(env); sfx.pop(); busy = false;
    mission(m.friend ? '💗' : '✉️', `<small>رسالة من ${esc(m.from)}</small>"${esc(m.t)}"`, i + 1, MSGS.length);
    speak(`رسالة من ${m.from}: ${m.t}. امشي للمنصة الصح.`);
    let ok = false, picked = null;
    while (!ok){
      let on = null;
      await waitUntil(() => { if (busy) return false; on = pads.find(p => dist2(player, p.p.position.x, p.p.position.z) < 1.3); return !!on; });
      picked = on.k; ok = m.ans.includes(picked);
      puff(on.p.position, ok ? 0x1fb88a : 0xff5c7a, 8);
      if (ok) right(); else mistake();
      const msg = ok ? (picked === 'tell' && m.ans[0] !== 'tell' ? 'صح! قولي لأهلك دايماً 🏠' : m.ok) : (picked === 'shield' ? 'زين! بس لازم تقولين لأهلك 🏠' : m.no);
      react(ok, msg); busy = true; await wait(1); busy = false;
      if (!ok) await autoWalk(player.position.x, 4.5);
    }
    $('#mission').hidden = true; lastMissionText = '';
    if (picked === 'tell'){
      const mama = girl3d(CAST.mom.d3); mama.position.set(-1.6, 0, 2.6); scene.add(mama); puff(mama.position, 0x8a5cff, 8); face(mama, player.position.x, player.position.z);
      quiet(wait(1.8).then(() => { puff(mama.position, 0x8a5cff, 8); scene.remove(mama); }));
      label(mama, '💜 شكراً يا حبيبتي', 'good big', 2.6);
    }
    if (m.friend){ await wait(.6); puff(cousin.position, 0xff8fc8, 8); cousin.visible = false; }
    await autoWalk(0, 6);
  }
  // the reveal
  busy = true;
  toast('مين "نجمة_الألعاب" بالحقيقة؟ 🤔'); await wait(1.2);
  puff(str.position, 0x6a5e8a, 16); sfx.bad();
  scene.remove(str); unlabel(strL);
  const fx = fox3d(); fx.position.set(0, top, -8); scene.add(fx); face(fx, 0, 6);
  const fL = label(fx, '🦊 هههه! كشفتيني!', 'bad big', 2.4);
  await wait(1.8);
  sfx.whoosh(); unlabel(fL);
  await tween(1.2, e => { fx.position.set(0, top + e * 9, -8 - e * 22); fx.rotation.x = e * 12; fx.rotation.z = e * 8; });
  scene.remove(fx); right('حظرناها! ✅'); await wait(1);
  await finish(3, starsFor(mistakes), 'ما أكلّم الغرباء، وأقول لأهلي.', '💛 بابا: نحبك ونحميك دايماً!');
}

/* ================= loop + boot ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  for (const f of tickers.slice()) f(dt, T);
  animActors(dt);
  if (mode === 'level') updatePlayer(dt);
  if (mode === 'title') titleCam(dt); else if (mode === 'map') mapCam(dt, false); else updateCamera(dt);
  updateLabels();
  R.render(scene, camera);
  requestAnimationFrame(loop);
}
function start(data){
  load();
  if (data && data.S) S = { ...S, ...data.S };
  if (!AVATARS[S.avatar]) S.avatar = 'g1';
  $('#loading').remove();
  try{ speechSynthesis.getVoices(); }catch(e){}
  resize(); showTitle(); requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
