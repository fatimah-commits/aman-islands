name: Transcribe recordings
on:
  push:
    branches: [main]
    paths: ['voice-src/*.mp3', '.github/workflows/transcribe.yml']
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install faster-whisper imageio-ffmpeg
      - run: |
          python - <<'PY'
          import json, glob, subprocess, numpy as np, imageio_ffmpeg
          from faster_whisper import WhisperModel
          m = WhisperModel('medium', device='cpu', compute_type='int8')
          for f in sorted(glob.glob('voice-src/*.mp3')):
              pcm = subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-v', 'error', '-i', f, '-f', 's16le', '-ac', '1', '-ar', '16000', '-'], capture_output=True, check=True).stdout
              audio = np.frombuffer(pcm, np.int16).astype(np.float32) / 32768
              segs, _ = m.transcribe(audio, language='ar', word_timestamps=True, vad_filter=False)
              out = [{'s': s.start, 'e': s.end, 't': s.text, 'w': [[w.start, w.end, w.word] for w in s.words]} for s in segs]
              json.dump(out, open(f[:-4] + '.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=0)
              print(f, len(out))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add voice-src/*.json
          git commit -m "Transcribe recordings"
          git pull --rebase origin main
          git push
